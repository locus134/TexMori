appId: com.texmori.desktop
productName: TexMori
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
compression: maximum
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
asarUnpack:
  - "**/*.node"
  - "**/*.dylib"
extraFiles:
  - from: build/finder-integration/TexMoriTexture.mdimporter
    to: Library/Spotlight/TexMoriTexture.mdimporter
extraResources:
  - from: build/etcpak/etcpak
    to: engines/etcpak
  - from: build/engines/PVRTexToolCLI-arm64
    to: engines/PVRTexToolCLI
  - from: build/engines/PowerVR-Tools-License.html
    to: licenses/PowerVR-Tools-License.html
  - from: build/licenses
    to: licenses/components
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: config/engines.lock.json
    to: engines/engines.lock.json
mac:
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Compressed Texture
        CFBundleTypeRole: None
        LSItemContentTypes:
          - com.texmori.pkm
          - com.texmori.pvr
          - com.texmori.dds
          - com.texmori.ccz
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.texmori.pkm
        UTTypeDescription: PKM texture
        UTTypeConformsTo: [public.image]
        UTTypeTagSpecification:
          public.filename-extension: [pkm]
          public.mime-type: image/x-pkm
      - UTTypeIdentifier: com.texmori.pvr
        UTTypeDescription: PVR texture
        UTTypeConformsTo: [public.image]
        UTTypeTagSpecification:
          public.filename-extension: [pvr]
      - UTTypeIdentifier: com.texmori.dds
        UTTypeDescription: DDS texture
        UTTypeConformsTo: [public.image]
        UTTypeTagSpecification:
          public.filename-extension: [dds]
      - UTTypeIdentifier: com.texmori.ccz
        UTTypeDescription: CCZ texture
        UTTypeConformsTo: [public.image]
        UTTypeTagSpecification:
          public.filename-extension: [ccz]
  category: public.app-category.developer-tools
  minimumSystemVersion: "13.0"
  target: dir
  icon: build/icon.icns
  identity: "-"
  hardenedRuntime: true
  entitlements: apps/desktop/resources/entitlements.mac.plist
  entitlementsInherit: apps/desktop/resources/entitlements.mac.plist
artifactName: TexMori-${version}-macOS-${arch}.${ext}
